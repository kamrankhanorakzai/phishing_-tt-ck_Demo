name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/camcheck:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |
          # Update system and install Docker if needed
          sudo apt update -y
          sudo apt install -y docker.io

          # Start and enable Docker
          sudo systemctl start docker
          sudo systemctl enable docker

          # Stop and remove existing containers
          sudo docker stop $(sudo docker ps -q) 2>/dev/null || true
          sudo docker rm $(sudo docker ps -aq) 2>/dev/null || true

          # Remove existing images
          sudo docker rmi $(sudo docker images -q) 2>/dev/null || true

          # Pull latest image
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/camcheck:latest

          # Run new container
          sudo docker run -d -p 3000:3000 \
            --name camcheck-app \
            --restart unless-stopped \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e S3_BUCKET=${{ secrets.S3_BUCKET }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/camcheck:latest

          # Install Cloudflare tunnel if not installed
          if ! command -v cloudflared &> /dev/null; then
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
          fi

          # Stop existing tunnel if running
          #sudo pkill -f cloudflared || true

          # Start Cloudflare tunnel
          #nohup cloudflared tunnel --url http://localhost:3000 > /dev/null 2>&1 &
