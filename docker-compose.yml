version: '3.8'

services:
  camhack-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
    env_file:
      - .env
    volumes:
      - ./captures:/app/captures
      - ./downloaded_pics:/app/downloaded_pics
    restart: unless-stopped
